[program:oesap]
command=/bin/zsh +m -ic 'exec env NODE_OPTIONS="--require /usr/local/lib/agent-process-title.cjs ${NODE_OPTIONS:-}" /usr/local/bin/oesap daemon run --home "$HOME/.paseo"'
directory=%(ENV_HOME)s
user=%(ENV_USER)s
autostart=true
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/oesap.out
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/tmp/oesap.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
